  // -------------------------------------------------------------- normalisation
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/\$|\\[a-z]+|[{}]/g, ' ').replace(/[^\p{L}\p{N}]+/gu, ' ').trim();
  }
  function lev(a, b) {
    if (a === b) return 0; const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
    let prev = Array.from({ length: n + 1 }, (_, i) => i);
    for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; }
    return prev[n];
  }

  // -------------------------------------------------------------- quiz QCM
  function renderQuiz(deckId, subset) {
    const deck = deckById(deckId);
    const pool = cardsOf(deckId);
    let dir = 'fb';
    let qs = [], i = 0, score = 0, misses = [];
    function build() {
      const src = subset ? pool.filter((c) => subset.includes(c.id)) : pool;
      qs = shuffle(src).slice(0, Math.min(10, src.length)).map((c) => {
        const ans = dir === 'fb' ? c.back : c.front;
        const distract = shuffle(pool.filter((x) => x.id !== c.id).map((x) => (dir === 'fb' ? x.back : x.front)).filter((t, k, arr) => t !== ans && arr.indexOf(t) === k)).slice(0, 3);
        return { c, prompt: dir === 'fb' ? c.front : c.back, ans, opts: shuffle([ans, ...distract]) };
      });
      i = 0; score = 0; misses = [];
    }
    function head() {
      return `<header class="study-top"><a class="icon-btn" href="#/deck/${deckId}" aria-label="Quitter">${ICON.close}</a>
        <div class="counts" style="color:var(--muted)">${Math.min(i + 1, qs.length)} / ${qs.length}</div>
        <div class="seg" role="group" aria-label="Sens"><button data-d="fb" aria-pressed="${dir === 'fb'}" title="Question → réponse">Q→R</button><button data-d="bf" aria-pressed="${dir === 'bf'}" title="Réponse → question">R→Q</button></div></header>
        <div class="progress"><i style="width:${(i / qs.length) * 100}%"></i></div>`;
    }
    function show() {
      if (i >= qs.length) return end();
      const q = qs[i];
      app.innerHTML = head() + `<div class="q-card pop"><div>${esc(q.prompt)}</div></div>
        <div class="options">${q.opts.map((o, k) => `<button class="opt" data-k="${k}"><span class="k">${k + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
        <div id="next"></div>`;
      renderMath(app);
      $$('.seg button').forEach((b) => b.onclick = () => { if (b.dataset.d !== dir) { dir = b.dataset.d; build(); show(); } });
      $$('.opt').forEach((b) => b.onclick = () => pick(+b.dataset.k));
    }
    let answered = false;
    function pick(k) {
      if (answered) return; answered = true;
      const q = qs[i]; const ok = q.opts[k] === q.ans;
      if (ok) score++; else misses.push(q);
      $$('.opt').forEach((b, j) => { b.disabled = true; if (q.opts[j] === q.ans) b.classList.add('correct'); else if (j === k) b.classList.add('wrong'); });
      $('#next').innerHTML = `<button class="btn btn-primary btn-block" style="margin-top:var(--space-4)" id="nx">${i + 1 < qs.length ? 'Suivant' : 'Voir le résultat'}</button>`;
      $('#nx').onclick = advance;
      if (ok) setTimeout(() => { if (answered && qs[i] === q) advance(); }, 750);
    }
    function advance() { answered = false; i++; show(); }
    function end() {
      const pct = Math.round((score / qs.length) * 100);
      const R = 54, C = 2 * Math.PI * R;
      const msg = pct === 100 ? 'Parfait. Passe à un autre paquet ou inverse le sens.' : pct >= 70 ? 'Solide. Refais uniquement tes erreurs pour verrouiller.' : 'À retravailler : refais tes erreurs, puis relance une révision espacée.';
      app.innerHTML = `<div class="done pop" style="padding-top:var(--space-8)">
        <div class="score-ring"><svg viewBox="0 0 128 128"><circle cx="64" cy="64" r="${R}" stroke="var(--surface-offset)" stroke-width="10" fill="none"/><circle cx="64" cy="64" r="${R}" stroke="${pct >= 70 ? 'var(--good)' : pct >= 40 ? 'var(--hard)' : 'var(--again)'}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - pct / 100)}"/></svg><b>${score}/${qs.length}</b></div>
        <h2>${pct} % de bonnes réponses</h2><p>${msg}</p>
        ${misses.length ? `<div class="miss-list">${misses.map((m) => `<div>${esc(m.prompt)}<span>${esc(m.ans)}</span></div>`).join('')}</div>` : ''}
        <div class="actions">
          ${misses.length ? '<button class="btn btn-primary" id="redo">Refaire mes erreurs</button>' : ''}
          <button class="btn ${misses.length ? 'btn-ghost' : 'btn-primary'}" id="again">Nouveau quiz</button>
          <a class="btn btn-ghost" href="#/deck/${deckId}">Retour au paquet</a></div></div>`;
      renderMath(app);
      if (misses.length) $('#redo').onclick = () => { const ids = misses.map((m) => m.c.id); cleanup && cleanup(); renderQuiz(deckId, ids); renderMath(app); };
      $('#again').onclick = () => { cleanup && cleanup(); renderQuiz(deckId); renderMath(app); };
    }
    const onKey = (e) => {
      if (['1', '2', '3', '4'].includes(e.key) && !answered && qs[i]) { const k = +e.key - 1; if (k < qs[i].opts.length) pick(k); }
      else if ((e.key === 'Enter' || e.key === ' ') && answered) { e.preventDefault(); advance(); }
    };
    document.addEventListener('keydown', onKey);
    cleanup = () => document.removeEventListener('keydown', onKey);
    build(); show();
  }

  // -------------------------------------------------------------- write mode
  function renderWrite(deckId) {
    const qs = shuffle(cardsOf(deckId)).slice(0, 10);
    let i = 0, score = 0, misses = [], checked = false;
    function show() {
      if (i >= qs.length) return end();
      const c = qs[i]; checked = false;
      app.innerHTML = `<header class="study-top"><a class="icon-btn" href="#/deck/${deckId}" aria-label="Quitter">${ICON.close}</a>
        <div class="counts" style="color:var(--muted)">${i + 1} / ${qs.length}</div><span style="width:44px"></span></header>
        <div class="progress"><i style="width:${(i / qs.length) * 100}%"></i></div>
        <div class="q-card pop"><div>${esc(c.front)}</div></div>
        <label class="sr-only" for="wa">Ta réponse</label>
        <textarea class="write-input" id="wa" placeholder="Écris la réponse de mémoire…" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
        <div id="res"></div>
        <div class="btn-row" id="acts"><button class="btn btn-ghost" id="skip">Je ne sais pas</button><button class="btn btn-primary" id="chk">Vérifier</button></div>`;
      renderMath(app);
      const inp = $('#wa'); if (!matchMedia('(hover: none)').matches) inp.focus();
      $('#chk').onclick = () => check(inp.value);
      $('#skip').onclick = () => check('');
      inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); checked ? next() : check(inp.value); } };
    }
    function check(v) {
      if (checked) return; checked = true;
      const c = qs[i]; const a = norm(v), b = norm(c.back);
      const tol = Math.floor(b.length * 0.15);
      const ok = !!a && (a === b || (b.length >= 4 && lev(a, b) <= tol));
      if (ok) score++; else misses.push(c);
      $('#wa').disabled = true;
      $('#res').innerHTML = `<div class="verdict ${ok ? 'ok' : 'ko'}"><b>${ok ? (a === b ? 'Exact' : 'Correct, à une faute près') : v ? 'Pas tout à fait' : 'Réponse attendue'}</b><div class="ans">${esc(c.back)}</div></div>`;
      renderMath($('#res'));
      $('#acts').innerHTML = `${!ok && v ? '<button class="btn btn-ghost" id="over">J\'avais juste</button>' : ''}<button class="btn btn-primary" id="nx">${i + 1 < qs.length ? 'Suivant' : 'Résultat'}</button>`;
      $('#nx').onclick = next;
      const ov = $('#over'); if (ov) ov.onclick = () => { score++; misses.pop(); next(); };
      if (matchMedia('(hover: none)').matches) $('#nx').focus();
    }
    function next() { i++; show(); }
    function end() {
      const pct = Math.round((score / qs.length) * 100);
      app.innerHTML = `<div class="done pop"><div class="mark" style="${pct < 70 ? 'background:var(--hard-soft);color:var(--hard)' : ''}">${ICON.check}</div>
        <h2>${score} / ${qs.length} restituées</h2><p>${pct >= 70 ? 'La restitution active est le meilleur test : tu sais ces cartes.' : 'Normal : écrire est plus exigeant que reconnaître. Reprends les cartes ratées demain.'}</p>
        ${misses.length ? `<div class="miss-list">${misses.map((m) => `<div>${esc(m.front)}<span>${esc(m.back)}</span></div>`).join('')}</div>` : ''}
        <div class="actions"><button class="btn btn-primary" id="again">Recommencer</button><a class="btn btn-ghost" href="#/deck/${deckId}">Retour au paquet</a></div></div>`;
      renderMath(app);
      $('#again').onclick = () => { renderWrite(deckId); renderMath(app); };
    }
    show();
  }

  function renderHabitList() {
    const el = $('#h-list'); if (!el) return;

    if (!db.habits.length) { el.innerHTML = `<div class="empty">Aucune habitude créée.</div>`; return; }

        <div class="habit-card" style="--cat-col:${cc.col}" data-id="${h.id}">

        </div></div>`;

    $$('[data-hdel]', el).forEach((b) => b.onclick = () => askDeleteHabit(b.dataset.hdel));
    // swipe-to-delete (touch)
    $$('.swipe-item .habit-card').forEach((card) => {
      const id = card.dataset.id;
      card.addEventListener('touchstart', (e) => { dragId = id; touchX = e.touches[0].clientX; dragEl = card; card.style.transition = 'none'; }, { passive: true });
      card.addEventListener('touchmove', (e) => { if (!dragEl || dragId !== id) return; const dx = e.touches[0].clientX - touchX; if (dx < 0) card.style.left = Math.max(dx, -90) + 'px'; }, { passive: true });
      card.addEventListener('touchend', () => {
        if (!dragEl || dragId !== id) return; card.style.transition = 'left .25s var(--ease)';

      }, { passive: true });
    });

    });
  }

  // -------------------------------------------------------------- import de documents
  async function handleDocImport(file) {
    if (!file) return;
    const resultEl = $('#h-import-result');
    if (!resultEl) return;
    resultEl.innerHTML = '<div style="padding:var(--space-3);color:var(--muted);font-size:var(--text-sm)">Analyse du document…</div>';
    try {
      const result = await window.DocParser.parseDocument(file);
      if (!result.success) {
        resultEl.innerHTML = `<div style="padding:var(--space-3);color:var(--again);font-size:var(--text-sm)">${esc(result.error || 'Erreur lors de l\'analyse.')}</div>`;
        return;
      }
      renderImportResult(result, resultEl);
    } catch (e) {
      resultEl.innerHTML = `<div style="padding:var(--space-3);color:var(--again);font-size:var(--text-sm)">Erreur : ${esc(e.message || 'inconnue')}</div>`;
    }
  }

  function renderImportResult(data, el) {
    const routines = data.routines || [];
    const schedule = data.schedule || [];
    if (!routines.length) {

  function openRoutinePlayer(rid) {
    const r = db.routines.find((x) => x.id === rid); if (!r) return;
    const tk = hDateKey(hToday()); if (!db.rcomp[tk]) db.rcomp[tk] = {};
    if (db.rcomp[tk][rid] === undefined) db.rcomp[tk][rid] = 0;

    const root = document.createElement('div');
    root.className = 'rp-bg on';
    root.id = 'rp-root';
    document.body.appendChild(root);

    function renderBody() {
      const done = db.rcomp[tk][rid] || 0; const total = r.steps.length;
      $('#rp-progress', root).style.width = (total ? Math.round(done / total * 100) : 0) + '%';
      let body = '';
      if (done >= total) {
        body = `<div class="rp-done-cta"><div style="font-size:44px;margin-bottom:var(--space-3)">🎉</div>
          <div style="font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-2);font-family:var(--font-display)">Routine terminée !</div>
          <div style="font-size:var(--text-sm);color:var(--muted);margin-bottom:var(--space-5)">Toutes les étapes sont cochées pour aujourd'hui.</div>
          <button class="rp-btn" id="rp-close-btn">Fermer</button></div>`;
      } else {
        const cur = r.steps[done];
        body = `<div class="rp-current"><div class="rp-step-no">Étape ${done+1} / ${total}</div>
          <div class="rp-step-txt">${esc(cur.text)}</div>
          <button class="rp-btn" id="rp-step-done">Étape terminée ✓</button></div>`;
      }
      body += r.steps.map((s, i) => `<div class="rp-item ${i < done ? 'done' : i === done ? 'current' : ''}">
        <div class="rp-dot">${i < done ? '✓' : i+1}</div><span class="rp-item-txt">${esc(s.text)}</span></div>`).join('');
      $('#rp-body', root).innerHTML = body;
      const closeBtn = $('#rp-close-btn', root); if (closeBtn) closeBtn.onclick = closePlayer;
      const stepBtn = $('#rp-step-done', root); if (stepBtn) stepBtn.onclick = () => {
        db.rcomp[tk][rid]++; save(); renderBody();
        if (db.rcomp[tk][rid] >= r.steps.length) toast('Routine terminée 🎉');
      };
    }

    root.innerHTML = `<div class="rp-head"><span class="rp-title">${esc(r.name)}</span><button class="rp-close">✕</button></div>
      <div class="rp-progress-bg"><div class="rp-progress-fill" id="rp-progress"></div></div>
      <div class="rp-body" id="rp-body"></div>`;
    $('.rp-close', root).onclick = closePlayer;
    renderBody();

    function closePlayer() { root.remove(); renderHabits(); }
  }

  // -------------------------------------------------------------- journal
  function saveJournal() {
    const key = hDateKey(hToday());
    const text = $('#j-input')?.value.trim();
    if (text) db.notes[key] = text; else delete db.notes[key];
    save();
    const el = $('#j-saved'); if (el) { el.style.opacity = '1'; setTimeout(() => el.style.opacity = '0', 2000); }
  }

  function renderJournalHist() {
    const el = $('#j-hist'); if (!el) return;
    const entries = Object.entries(db.notes).sort((a, b) => b[0].localeCompare(a[0]));
    if (!entries.length) { el.innerHTML = `<div class="empty">Aucune note pour l'instant.</div>`; return; }
    const groups = {};
    entries.forEach(([key, text]) => {
      const d = new Date(key + 'T12:00:00');
      const mk = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      if (!groups[mk]) groups[mk] = { label: MONTHS_FR[d.getMonth()] + ' ' + d.getFullYear(), entries: [] };
      groups[mk].entries.push({ key, text, d });
    });
    let html = '';
    for (const mk of Object.keys(groups).sort((a, b) => b.localeCompare(a))) {
      const g = groups[mk]; html += `<div><div class="month-title">${g.label}</div>`;
      for (const { key, text, d } of g.entries) {
        const p = dayScore(d.getFullYear(), d.getMonth(), d.getDate());
        const pct = p !== null ? Math.round(p * 100) : null;
        const col = pctColor(pct);
        const dayStr = d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }).replace(/^\w/, (c) => c.toUpperCase());
        html += `<div class="journal-entry"><div class="journal-top"><span class="journal-date">${dayStr}</span>
          ${pct !== null ? `<span class="journal-score" style="color:${col};background:${col}1a">${pct}%</span>` : ''}
          <button class="journal-del" data-del-note="${key}">✕</button></div>
          <div class="journal-text">${esc(text)}</div></div>`;
      }
      html += `</div>`;
    }
    el.innerHTML = html;
    $$('[data-del-note]').forEach((b) => b.onclick = () => { delete db.notes[b.dataset.delNote]; save(); renderJournalHist(); toast('Note supprimée'); });
  }

  // -------------------------------------------------------------- stats
  function renderStats() {
    const now = Date.now(), today = dayStart();
    const now2 = new Date(); const y2 = now2.getFullYear(); const m2 = now2.getMonth();
    const cs = db.cards;
    const nNew = cs.filter((c) => c.state === 'new').length;
    const nLearn = cs.filter((c) => c.state === 'learning' || c.state === 'relearning').length;
    const nYoung = cs.filter((c) => c.state === 'review' && c.ivl < 21).length;
    const nMature = cs.filter((c) => c.state === 'review' && c.ivl >= 21).length;
    const tot = cs.length || 1;
    const since = now - 30 * DAY;
    const revLogs = db.log.filter((l) => l.t >= since && l.s === 'review');
    const retention = revLogs.length ? Math.round((100 * revLogs.filter((l) => l.r > 1).length) / revLogs.length) : null;
    // prévision 7 jours
    const fc = Array.from({ length: 7 }, (_, d) => {
      const a = today + d * DAY, b = a + DAY;
      return cs.filter((c) => c.state !== 'new' && (d === 0 ? c.due < b : c.due >= a && c.due < b)).length;
    });
    const fmax = Math.max(1, ...fc);
    const dn = ['dim', 'lun', 'mar', 'mer', 'jeu', 'ven', 'sam'];
    // activité 15 semaines
    const counts = {}; db.log.forEach((l) => { const k = dayKey(l.t); counts[k] = (counts[k] || 0) + 1; });
    const weeks = 15;
    const todayDate = new Date(today);
    const dow = (todayDate.getDay() + 6) % 7; // lundi = 0
    const startT = today - (dow + (weeks - 1) * 7) * DAY;
    let heat = '';
    for (let d = 0; d < weeks * 7; d++) {
      const t = startT + d * DAY + 12 * HOUR; const n = counts[dayKey(t)] || 0;
      const lvl = n === 0 ? '' : n < 10 ? 'h1' : n < 30 ? 'h2' : n < 60 ? 'h3' : 'h4';
      heat += `<i class="${t > now + DAY ? 'future' : lvl}" title="${new Date(t).toLocaleDateString('fr-FR')} : ${n}"></i>`;
    }
    const st = streak();
    app.innerHTML = `<header class="topbar"><h1 style="font-size:var(--text-xl)">Progrès</h1></header>
      <div class="kpis">
        <div class="kpi"><small>Série</small><b>${plural(st, 'jour')}</b></div>
        <div class="kpi"><small>Réponses aujourd'hui</small><b>${reviewsToday()}</b></div>
        <div class="kpi"><small>Rétention (30 j)</small><b>${retention === null ? '—' : retention + ' %'}</b></div>
        <div class="kpi"><small>Cartes maîtrisées</small><b>${nMature}</b></div>
      </div>
      <div class="panel"><h3>Charge des 7 prochains jours</h3>
        <div class="bars">${fc.map((n, d) => `<div class="bar ${n ? '' : 'zero'}"><em>${n}</em><i style="height:${(n / fmax) * 100}%"></i><span>${d === 0 ? 'auj.' : dn[new Date(today + d * DAY + 12 * HOUR).getDay()]}</span></div>`).join('')}</div></div>
      <div class="panel"><h3>État des ${plural(cs.length, 'carte')}</h3>
        <div class="stack"><i style="width:${(nNew / tot) * 100}%;background:var(--c-new);opacity:.35"></i><i style="width:${(nLearn / tot) * 100}%;background:var(--c-learn)"></i><i style="width:${(nYoung / tot) * 100}%;background:var(--c-review);opacity:.55"></i><i style="width:${(nMature / tot) * 100}%;background:var(--c-review)"></i></div>
        <div class="legend"><span style="--c:color-mix(in srgb, var(--c-new) 35%, var(--surface))">${nNew} nouvelles</span><span style="--c:var(--c-learn)">${nLearn} en apprentissage</span><span style="--c:color-mix(in srgb, var(--c-review) 55%, var(--surface))">${nYoung} jeunes (&lt; 21 j)</span><span style="--c:var(--c-review)">${nMature} matures</span></div></div>
      <div class="panel"><h3>Activité — ${weeks} dernières semaines</h3><div class="heat">${heat}</div></div>
      <p class="note" style="margin-top:var(--space-4)">Rétention : part des révisions (hors nouvelles cartes) non notées « Encore ». Vise 85 à 90 % : en dessous, tu ajoutes trop de nouvelles cartes ; au-dessus de 95 %, tu peux en ajouter plus.</p>

      <div class="section-head" style="margin-top:var(--space-8)"><h2>Habitudes</h2></div>
      ${renderHabitStats(now2, y2, m2)}
    `;
  }

  function renderHabitStats(now, y, m) {
    if (!db.habits.length) return `<div class="empty">Aucune habitude. <a href="#/habits" style="color:var(--primary);font-weight:600">En ajouter →</a></div>`;
    const gStreak = globalHabitStreak();
    const { pct } = monthScore(y, m);
    const monthPcts = []; let totExp = 0, totDone = 0, bestPct = -1, bestM = 0;
    for (let mm = 0; mm < 12; mm++) { const r = monthScore(y, mm); totExp += r.exp; totDone += r.done; monthPcts.push(r.pct); if (r.pct !== null && r.pct > bestPct) { bestPct = r.pct; bestM = mm; } }
    const yrPct = totExp > 0 ? Math.round(totDone / totExp * 100) : null;

    // category bars
    const usedCats = [...new Set(db.habits.map((h) => h.cat || 'perso'))];
    const catHtml = usedCats.map((k) => {
      const c = HABIT_CATS[k] || HABIT_CATS.perso;
      const hs = db.habits.filter((h) => (h.cat || 'perso') === k);
      let exp = 0, done = 0;
      hs.forEach((h) => { const r = habitMonthRate(h.id, y, m); if (r !== null) { exp++; done += r; } });
      const p = exp > 0 ? Math.round(done / exp) : null;
      return `<div class="cat-bar-row"><span class="cat-bar-lbl"><span class="cat-dot" style="background:${c.col};width:7px;height:7px;border-radius:50%;display:inline-block"></span>${c.lbl}</span>
        <div class="bar-bg"><div class="bar-fill" style="width:${p || 0}%;background:${c.col}"></div></div>
        <span class="bar-pct" style="color:${c.col}">${p !== null ? p + '%' : '—'}</span></div>`;
    }).join('');

    // heatmap
    const dim = new Date(y, m + 1, 0).getDate();
    const pad = hDayIndex(new Date(y, m, 1));
    let hm = '';
    for (let i = 0; i < pad; i++) hm += `<div class="hm-cell pad"></div>`;
    for (let d = 1; d <= dim; d++) {
      const p = dayScore(y, m, d); const pct2 = p !== null ? Math.round(p * 100) : null;
      const col = pctColor(pct2);
      const future = new Date(y, m, d) > now;
      hm += `<div class="hm-cell" style="background:${future ? 'transparent' : pct2 !== null ? col + '33' : 'var(--surface-offset)'};border:1px solid ${future ? 'var(--border)' : 'transparent'};color:${pct2 !== null ? col : 'var(--faint)'}">${d}</div>`;
    }

    // rings
    const ringsHtml = db.habits.map((h) => buildRing(h, y, m)).join('');

    // per-habit performance
    const perfHtml = db.habits.map((h) => {
      let exp = 0, done = 0;
      for (let mm = 0; mm <= m; mm++) {
        const dm = new Date(y, mm + 1, 0).getDate();
        const lim = mm === m ? now.getDate() : dm;
        for (let d = 1; d <= lim; d++) {
          const dt = new Date(y, mm, d);
          if (h.days.includes(hDayIndex(dt))) { exp++; if ((db.comp[hDateKey(dt)] || {})[h.id]) done++; }
        }
      }
      const p = exp > 0 ? Math.round(done / exp * 100) : null;
      const col = pctColor(p);
      const st = habitStreak(h.id, now);
      return `<div style="margin-bottom:var(--space-3)"><div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:var(--text-sm);font-weight:600">${esc(h.name)}${st > 2 ? ' 🔥' : ''}</span>
        <span style="font-size:var(--text-xs);font-weight:600;color:${col}">${done}/${exp} · ${p !== null ? p + '%' : '—'}</span></div>
        <div class="h-rate-bg" style="margin-top:var(--space-2)"><div class="h-rate-fill" style="width:${p || 0}%;background:${col}"></div></div></div>`;
    }).join('');

    return `
      <div class="stat-grid">
        <div class="stat-mini"><b style="color:${pctColor(yrPct)}">${yrPct !== null ? yrPct + '%' : '—'}</b><small>Année</small></div>
        <div class="stat-mini"><b style="color:var(--good);font-size:var(--text-sm);padding-top:4px">${bestPct >= 0 ? MSHORT_FR[bestM] + ' ' + bestPct + '%' : '—'}</b><small>Top mois</small></div>
        <div class="stat-mini"><b style="color:var(--primary)">${db.habits.length}</b><small>Habitudes</small></div>
        <div class="stat-mini"><b style="color:var(--hard)">${gStreak}</b><small>Série (j)</small></div>
      </div>
      <div class="panel"><h3>Par catégorie — ${MONTHS_FR[m]}</h3>${catHtml}</div>
      <div class="panel"><h3>${MONTHS_FR[m]} ${y} — heatmap</h3>
        <div class="hm-grid" style="margin-bottom:var(--space-2)">${HABIT_DAYS.map((d) => `<div class="hm-dow">${d}</div>`).join('')}</div>
        <div class="hm-grid">${hm}</div></div>
      <div class="panel"><h3>Rings par habitude — ${MONTHS_FR[m]}</h3>
        <div class="rings-grid">${ringsHtml}</div></div>
      <div class="panel"><h3>Par habitude — année</h3>${perfHtml}</div>`;
  }

    try { if (window.claude && window.claude.use) { window.claude.use('downloads').then((d) => { if (d) d.save({ filename: name.replace(/[\\/:*?"<>|]/g, '_'), data: content }).then(() => toast('Fichier enregistré')).catch(() => {}); else toast('Téléchargement indisponible ici'); }); return; } } catch (e) {}
    const blob = new Blob([content], { type });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name.replace(/[\\/:*?"<>|]/g, '_');
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

    $('#npd').onchange = (e) => { s.newPerDay = Math.max(0, Math.min(999, parseInt(e.target.value, 10) || 0)); save(); toast('Enregistré'); };
    $('#mpd').onchange = (e) => { s.maxPerDay = Math.max(0, Math.min(9999, parseInt(e.target.value, 10) || 0)); save(); toast('Enregistré'); };
    $('#applyall').onclick = () => { db.decks.forEach((d) => { delete d.newPerDay; delete d.maxPerDay; }); save(); toast('Appliqué à tous les paquets'); };
    $('#steps').onchange = (e) => { const st = parseSteps(e.target.value); if (st.length) { s.steps = st; save(); toast('Enregistré'); } else e.target.value = s.steps.join(', '); };
    $('#relearn').onchange = (e) => { const st = parseSteps(e.target.value); if (st.length) { s.relearn = st; save(); toast('Enregistré'); } else e.target.value = s.relearn.join(', '); };
    $('#grad').onchange = (e) => { s.gradIvl = Math.max(1, parseInt(e.target.value, 10) || 1); save(); toast('Enregistré'); };
    $('#easy').onchange = (e) => { s.easyIvl = Math.max(1, parseInt(e.target.value, 10) || 4); save(); toast('Enregistré'); };
    $('#lock').onclick = () => lockApp();
    $('#syncnow').onclick = async () => { $('#syncinfo').textContent = 'Synchronisation…'; await syncNow(true); if ($('#syncinfo')) $('#syncinfo').textContent = syncLabel(); };
    const am = $('#addmail');
    if (am) am.onclick = () => openSheet(`<h3>Ajouter une adresse e-mail</h3>
      <p style="color:var(--muted);margin:0 0 var(--space-4)">Tu recevras un lien de confirmation. Ensuite, tu te connecteras avec cette adresse (plus avec ton nom d'utilisateur). Tes données ne changent pas.</p>
      <div class="field"><label for="am1">Adresse e-mail</label><input id="am1" type="email" maxlength="254" autocomplete="email" placeholder="toi@exemple.fr"></div>
      <p class="gate-err" id="amerr" role="alert"></p>
      <button class="btn btn-primary btn-block" id="amok">Envoyer le lien</button>`, (sh) => {
      $('#amok', sh).onclick = async () => {
        const r = await window.AuthClient.changeEmail($('#am1', sh).value);
        if (r.ok) { closeSheet(); toast('Lien envoyé : confirme ton adresse par e-mail'); } else $('#amerr', sh).textContent = r.error || 'Erreur.';
      };
    });
    $('#chpw').onclick = () => openSheet(`<h3>Changer le mot de passe</h3>
      <div class="field"><label for="np1">Nouveau mot de passe</label><input id="np1" type="password" minlength="6" maxlength="128" autocomplete="new-password"></div>
      <div class="field"><label for="np2">Confirme</label><input id="np2" type="password" maxlength="128" autocomplete="new-password"></div>
      <p class="gate-err" id="nperr" role="alert"></p>
      <button class="btn btn-primary btn-block" id="npok">Enregistrer</button>`, (sh) => {
      $('#npok', sh).onclick = async () => {
        const p1 = $('#np1', sh).value, p2 = $('#np2', sh).value, err = $('#nperr', sh);
        if (p1.length < 6) { err.textContent = 'Au moins 6 caractères.'; return; }
        if (p1 !== p2) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
        const r = await window.AuthClient.changePassword(p1);
        if (r.ok) { closeSheet(); toast('Mot de passe modifié'); } else err.textContent = r.error || 'Erreur.';
      };
    });
    $('#exp').onclick = () => { download(`ancre-sauvegarde-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(db), 'application/json'); toast('Sauvegarde exportée'); };
    $('#impj').onclick = () => $('#file').click();
    $('#file').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      try { const d = JSON.parse(await f.text()); if (!Array.isArray(d.decks) || !Array.isArray(d.cards)) throw 0; db = sanitizeState(d); saveNow(); applyTheme(); toast('Sauvegarde restaurée'); go('#/'); }
      catch { toast('Fichier invalide'); }
    };
    $('#seed').onclick = () => { const s2 = seed(); s2.decks.forEach((d, k) => { d.color = DECK_COLORS[(db.decks.length + k) % DECK_COLORS.length]; }); db.decks.push(...s2.decks); db.cards.push(...s2.cards); save(); toast('4 paquets ajoutés'); go('#/'); };
    $('#seed-habits').onclick = () => { const s2 = seed(); if (s2.habits.length) { db.habits.push(...s2.habits); save(); toast(`${plural(s2.habits.length, 'habitude ajoutée', 'habitudes ajoutées')}`); go('#/habits'); } };
    $('#wipe').onclick = () => confirmSheet('Tout effacer ?', 'Cette action est irréversible. Exporte une sauvegarde avant si besoin.', 'Tout effacer', () => { db = { decks: [], cards: [], log: [], settings: db.settings, habits: [], comp: {}, routines: [], rcomp: {}, notes: {}, v: 2 }; saveNow(); toast('Données effacées'); go('#/'); });
  }

  // -------------------------------------------------------------- boot
  app.innerHTML = '<div class="done"><p>Chargement…</p></div>';
  ensureAuth().then(load).then(() => {
    applyTheme();
    addEventListener('hashchange', route);
    addEventListener('pagehide', () => saveNow(true));
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveNow(true); else syncNow(); });
    addEventListener('online', () => syncNow());
    setInterval(() => { if (!document.hidden) syncNow(); }, 90000);
    route();
  }).catch(fatal);
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())); } catch {}
})();

  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="window.__mathReady && window.__mathReady()"></script>
</body>
</html>
