  <style>
:root {
  --text-xs: 0.75rem;
  --text-sm: 0.875rem;
  --text-base: 1rem;
  --text-lg: 1.1875rem;
  --text-xl: 1.625rem;

  --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem;
  --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem; --space-10: 2.5rem; --space-12: 3rem; --space-16: 4rem;

  --font-display: 'Zodiak', 'Iowan Old Style', Georgia, serif;
  --font-body: 'General Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;

  --radius-sm: 0.5rem; --radius-md: 0.75rem; --radius-lg: 1.125rem; --radius-xl: 1.5rem;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --tabbar-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}

:root, [data-theme='light'] {
  --bg: #faf9f5;
  --surface: #ffffff;
  --surface-2: #ffffff;
  --surface-offset: #f0eee6;
  --border: #e8e6dc;
  --divider: #efede4;
  --text: #141413;
  --muted: #6b6a64;
  --faint: #b0aea5;
  --inverse: #faf9f5;
  --primary: #c6613f;
  --primary-hover: #a94f31;
  --primary-soft: #f5e4dc;
  --again: #b5483d; --again-soft: #f5dedb;
  --hard: #b7791f;  --hard-soft: #f4e8cf;
  --good: #5f8a5a;  --good-soft: #e3ecdd;
  --easy: #9a6b8f;  --easy-soft: #efe3ec;
  --c-new: #c6613f; --c-learn: #b5483d; --c-review: #5f8a5a;
  --shadow-card: 0 1px 2px rgba(20,20,19,.05), 0 8px 24px -12px rgba(20,20,19,.14);
  --shadow-lift: 0 2px 4px rgba(20,20,19,.06), 0 18px 40px -16px rgba(20,20,19,.24);
  --rule: rgba(20,20,19,.04);
}

[data-theme='dark'] {
  --bg: #262624;
  --surface: #30302e;
  --surface-2: #353532;
  --surface-offset: #3d3d3a;
  --border: #44443f;
  --divider: #3a3a37;
  --text: #faf9f5;
  --muted: #b0aea5;
  --faint: #706f68;
  --inverse: #262624;
  --primary: #d97757;
  --primary-hover: #e48b6e;
  --primary-soft: #44302a;
  --again: #e5877c; --again-soft: #46302e;
  --hard: #dfb46a;  --hard-soft: #433a28;
  --good: #9cc08f;  --good-soft: #2f3a2c;
  --easy: #c79bb9;  --easy-soft: #3f3140;
  --c-new: #d97757; --c-learn: #e5877c; --c-review: #9cc08f;
  --shadow-card: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.55);
  --shadow-lift: 0 2px 4px rgba(0,0,0,.3), 0 18px 40px -16px rgba(0,0,0,.65);
  --rule: rgba(250,249,245,.04);
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100dvh;
  font-family: var(--font-body); font-size: var(--text-base); line-height: 1.5;
  color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.shell { max-width: 520px; margin: 0 auto; min-height: 100dvh; position: relative; }
main { padding: var(--space-4) var(--space-5) calc(var(--tabbar-h) + var(--safe-b) + var(--space-8)); }
body.focus main { padding-bottom: calc(var(--safe-b) + var(--space-6)); }

/* ---------- Top bar ---------- */
.topbar { display: flex; align-items: center; gap: var(--space-3); min-height: 48px; margin-bottom: var(--space-4); }
.topbar .brand { display: flex; align-items: center; gap: var(--space-2); font-family: var(--font-display); font-weight: 700; font-size: 1.375rem; letter-spacing: -0.01em; }
.topbar .brand svg { width: 28px; height: 28px; color: var(--primary); }
.topbar .spacer { flex: 1; }
.topbar h1 { font-family: var(--font-display); font-size: var(--text-lg); font-weight: 700; margin: 0; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 999px; color: var(--text); flex: none; }
.icon-btn:hover { background: var(--surface-offset); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.icon-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Hero / today ---------- */
.today { padding: var(--space-6) var(--space-5); border-radius: var(--radius-xl); background: var(--surface-2); box-shadow: var(--shadow-card); margin-bottom: var(--space-6); position: relative; overflow: hidden; }
.today::after { content: ''; position: absolute; inset: 0; pointer-events: none; background-image: repeating-linear-gradient(to bottom, transparent 0 27px, var(--rule) 27px 28px); }
.today > * { position: relative; z-index: 1; }
.today .eyebrow { font-size: var(--text-xs); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 600; }
.today .big { font-family: var(--font-display); font-size: var(--text-xl); font-weight: 700; line-height: 1.15; margin: var(--space-2) 0 var(--space-1); }
.today .sub { color: var(--muted); font-size: var(--text-sm); margin: 0 0 var(--space-5); }
.today .row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: var(--space-1); font-size: var(--text-xs); font-weight: 600; padding: var(--space-1) var(--space-3); border-radius: 999px; background: var(--surface-offset); color: var(--muted); }
.chip.fire { background: var(--hard-soft); color: var(--hard); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 48px; padding: 0 var(--space-5); border-radius: 999px; border: 1px solid transparent; font-weight: 600; font-size: var(--text-sm); transition: transform .15s var(--ease), background .2s, box-shadow .2s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: var(--inverse); }
.btn-primary:hover { background: var(--primary-hover); }
.btn-ghost { background: transparent; border-color: var(--border); color: var(--text); }
.btn-ghost:hover { background: var(--surface-offset); }
.btn-soft { background: var(--primary-soft); color: var(--primary); }
.btn-danger { background: transparent; color: var(--again); border-color: var(--border); }
.btn-block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Section ---------- */
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: var(--space-6) 0 var(--space-3); }
.section-head h2 { font-size: var(--text-sm); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
.section-head .link { font-size: var(--text-sm); color: var(--primary); font-weight: 600; background: none; border: 0; padding: var(--space-2); }

/* ---------- Deck list ---------- */
.decks { display: grid; gap: var(--space-3); }
.deck { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); transition: transform .2s var(--ease), box-shadow .2s, border-color .2s; }
.deck:hover { border-color: var(--faint); box-shadow: var(--shadow-card); }
.deck:active { transform: scale(.985); }
.deck .spine { width: 6px; align-self: stretch; border-radius: 3px; background: var(--deck-color, var(--primary)); flex: none; margin-left: calc(var(--space-2) * -1); }
.deck .info { flex: 1; min-width: 0; }
.deck .name { font-weight: 600; font-size: var(--text-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.deck .meta { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; }
.counts { display: flex; gap: var(--space-2); font-variant-numeric: tabular-nums; font-weight: 600; font-size: var(--text-sm); }
.counts span { min-width: 1.5ch; text-align: right; }
.counts .n { color: var(--c-new); } .counts .l { color: var(--c-learn); } .counts .r { color: var(--c-review); }
.counts .zero { color: var(--faint); }

.fab { position: fixed; right: max(var(--space-5), calc(50% - 260px + var(--space-5))); bottom: calc(var(--tabbar-h) + var(--safe-b) + var(--space-4)); width: 56px; height: 56px; border-radius: 18px; background: var(--primary); color: var(--inverse); border: 0; display: grid; place-items: center; box-shadow: var(--shadow-lift); z-index: 20; transition: transform .2s var(--ease); }
.fab:active { transform: scale(.94); }
.fab svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: round; }

/* ---------- Tab bar ---------- */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: 0; width: 100%; max-width: 520px; height: calc(var(--tabbar-h) + var(--safe-b)); padding-bottom: var(--safe-b); display: flex; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--border); z-index: 30; }
.tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
.tabbar a svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a.active { color: var(--primary); }
body.focus .tabbar { display: none; }

/* ---------- Deck detail ---------- */
.deck-hero { padding: var(--space-5); background: var(--surface-2); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); margin-bottom: var(--space-4); }
.stat-trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-bottom: var(--space-5); }
.stat-trio div { text-align: center; padding: var(--space-3) var(--space-2); border-radius: var(--radius-md); background: var(--surface-offset); }
.stat-trio b { display: block; font-family: var(--font-display); font-size: var(--text-xl); line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-trio small { font-size: var(--text-xs); color: var(--muted); }
.stat-trio .n b { color: var(--c-new); } .stat-trio .l b { color: var(--c-learn); } .stat-trio .r b { color: var(--c-review); }
.mode-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); margin-top: var(--space-2); }

.search { position: relative; margin: var(--space-4) 0 var(--space-3); }
.search input { width: 100%; height: 44px; padding: 0 var(--space-4) 0 var(--space-10); border: 1px solid var(--border); border-radius: 999px; background: var(--surface); font-size: var(--text-base); }
.search input:focus { outline: none; border-color: var(--primary); }
.search svg { position: absolute; left: var(--space-4); top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }

.card-list { display: grid; gap: var(--space-2); }
.card-row { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: var(--space-1) var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.card-row:hover { border-color: var(--faint); }
.card-row .f { font-weight: 500; font-size: var(--text-sm); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-row .b { grid-column: 1; font-size: var(--text-sm); color: var(--muted); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.card-row .tag { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: var(--text-xs); font-weight: 600; padding: 2px var(--space-2); border-radius: 999px; white-space: nowrap; }
.tag.new { background: var(--easy-soft); color: var(--c-new); }
.tag.learn { background: var(--again-soft); color: var(--c-learn); }
.tag.review { background: var(--good-soft); color: var(--c-review); }
.tag.due { background: var(--hard-soft); color: var(--hard); }

/* ---------- Study ---------- */
.study-top { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-3); }
.study-top .counts { flex: 1; justify-content: center; font-size: var(--text-base); gap: var(--space-4); }
.study-top .counts .cur { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 2px; }
.progress { height: 4px; background: var(--surface-offset); border-radius: 2px; overflow: hidden; margin-bottom: var(--space-5); }
.progress i { display: block; height: 100%; background: var(--primary); border-radius: 2px; transition: width .4s var(--ease); }

.stage { perspective: 1400px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.flash { position: relative; min-height: min(56dvh, 460px); cursor: pointer; transform-style: preserve-3d; transition: transform .55s var(--ease); }
.flash.flipped { transform: rotateY(180deg); }
.flash.dragging { transition: none; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; background: var(--surface-2); border-radius: var(--radius-xl); box-shadow: var(--shadow-lift); padding: var(--space-8) var(--space-6); display: flex; flex-direction: column; overflow: auto; }
.face .label { position: absolute; top: var(--space-5); left: var(--space-6); font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .1em; color: var(--faint); font-weight: 600; background: var(--surface-2); padding-right: var(--space-2); }
.face .content { margin: auto 0; text-align: center; font-size: var(--text-lg); line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; }
.face.back { transform: rotateY(180deg); }
.face.back .q { font-size: var(--text-sm); color: var(--muted); text-align: center; padding-bottom: var(--space-4); margin: var(--space-4) 0 0; border-bottom: 1px dashed var(--border); white-space: pre-wrap; }
.face .hint-tap { position: absolute; bottom: var(--space-4); left: 0; right: 0; text-align: center; font-size: var(--text-xs); color: var(--faint); }
.swipe-tint { position: absolute; inset: 0; border-radius: var(--radius-xl); pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 3; display: grid; place-items: center; font-weight: 700; font-size: var(--text-lg); }
.swipe-tint.left { background: color-mix(in srgb, var(--again) 16%, transparent); color: var(--again); box-shadow: inset 0 0 0 2px var(--again); }
.swipe-tint.right { background: color-mix(in srgb, var(--good) 16%, transparent); color: var(--good); box-shadow: inset 0 0 0 2px var(--good); }

.answer-bar { margin-top: var(--space-5); min-height: 64px; }
.ratings { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-2); }
.rate { border: 0; border-radius: var(--radius-md); padding: var(--space-3) var(--space-1); display: flex; flex-direction: column; align-items: center; gap: 2px; font-weight: 600; font-size: var(--text-sm); transition: transform .12s var(--ease); min-height: 64px; justify-content: center; }
.rate:active { transform: scale(.95); }
.rate small { font-weight: 500; font-size: var(--text-xs); opacity: .85; font-variant-numeric: tabular-nums; }
.rate.r1 { background: var(--again-soft); color: var(--again); }
.rate.r2 { background: var(--hard-soft); color: var(--hard); }
.rate.r3 { background: var(--good-soft); color: var(--good); }
.rate.r4 { background: var(--easy-soft); color: var(--easy); }
.kbd-hint { text-align: center; font-size: var(--text-xs); color: var(--faint); margin-top: var(--space-3); }
@media (hover: none) { .kbd-hint.desktop { display: none; } }
@media (hover: hover) { .kbd-hint.touch { display: none; } }

/* ---------- Done / empty ---------- */
.done { text-align: center; padding: var(--space-12) var(--space-4) var(--space-8); }
.done .mark { width: 72px; height: 72px; margin: 0 auto var(--space-5); border-radius: 22px; display: grid; place-items: center; background: var(--good-soft); color: var(--good); }
.done .mark svg { width: 36px; height: 36px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.done h2 { font-family: var(--font-display); font-size: var(--text-xl); margin: 0 0 var(--space-2); line-height: 1.2; }
.done p { color: var(--muted); margin: 0 auto var(--space-6); max-width: 34ch; }
.done .actions { display: grid; gap: var(--space-2); max-width: 320px; margin: 0 auto; }
.empty { text-align: center; padding: var(--space-8) var(--space-4); color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius-lg); }
.empty b { display: block; color: var(--text); margin-bottom: var(--space-1); }

/* ---------- Quiz / write ---------- */
.q-card { background: var(--surface-2); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-8) var(--space-6); text-align: center; font-size: var(--text-lg); min-height: 180px; display: grid; place-items: center; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: var(--space-5); }
.options { display: grid; gap: var(--space-2); }
.opt { text-align: left; width: 100%; padding: var(--space-4); background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: var(--text-sm); display: flex; gap: var(--space-3); align-items: flex-start; white-space: pre-wrap; overflow-wrap: anywhere; transition: border-color .15s, background .15s; }
.opt .k { flex: none; width: 24px; height: 24px; border-radius: 7px; background: var(--surface-offset); display: grid; place-items: center; font-size: var(--text-xs); font-weight: 600; color: var(--muted); }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--again); background: var(--again-soft); }
.opt:disabled { cursor: default; }
.write-input { width: 100%; min-height: 96px; resize: vertical; padding: var(--space-4); border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); font-size: var(--text-base); }
.write-input:focus { outline: none; border-color: var(--primary); }
.verdict { margin: var(--space-4) 0; padding: var(--space-4); border-radius: var(--radius-md); font-size: var(--text-sm); }
.verdict.ok { background: var(--good-soft); color: var(--good); }
.verdict.ko { background: var(--again-soft); color: var(--again); }
.verdict .ans { color: var(--text); margin-top: var(--space-2); white-space: pre-wrap; font-size: var(--text-base); }
.btn-row { display: flex; gap: var(--space-2); margin-top: var(--space-4); }
.btn-row .btn { flex: 1; }
.score-ring { width: 128px; height: 128px; margin: 0 auto var(--space-5); position: relative; }
.score-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.score-ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: var(--text-xl); }
.miss-list { text-align: left; display: grid; gap: var(--space-2); margin: var(--space-6) 0; }
.miss-list div { padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--border); font-size: var(--text-sm); white-space: pre-wrap; }
.miss-list div span { display: block; color: var(--muted); margin-top: var(--space-1); }

/* ---------- Sheet ---------- */
.backdrop { position: fixed; inset: 0; background: rgba(10,12,20,.42); z-index: 50; opacity: 0; transition: opacity .25s; }
.backdrop.open { opacity: 1; }
.sheet { position: fixed; left: 50%; bottom: 0; transform: translate(-50%, 100%); width: 100%; max-width: 520px; max-height: 92dvh; overflow: auto; background: var(--surface-2); border-radius: var(--radius-xl) var(--radius-xl) 0 0; z-index: 51; padding: var(--space-3) var(--space-5) calc(var(--space-6) + var(--safe-b)); transition: transform .35s var(--ease); }
.sheet.open { transform: translate(-50%, 0); }
.sheet .grip { width: 40px; height: 4px; border-radius: 2px; background: var(--border); margin: 0 auto var(--space-4); }
.sheet h3 { font-family: var(--font-display); font-size: var(--text-lg); margin: 0 0 var(--space-4); }
.field { display: grid; gap: var(--space-2); margin-bottom: var(--space-4); }
.field label { font-size: var(--text-xs); font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; }
.field input, .field textarea, .field select { width: 100%; padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); border: 1.5px solid var(--border); background: var(--surface); font-size: var(--text-base); }
.field textarea { min-height: 88px; resize: vertical; }
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--primary); }
.preview { font-size: var(--text-sm); padding: var(--space-3) var(--space-4); background: var(--surface-offset); border-radius: var(--radius-md); min-height: 44px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.preview:empty::before { content: 'Aperçu'; color: var(--faint); }
.help { font-size: var(--text-xs); color: var(--muted); margin: calc(var(--space-2) * -1) 0 var(--space-4); }
.help code { background: var(--surface-offset); padding: 1px 5px; border-radius: 4px; font-size: .95em; }
.menu { display: grid; gap: 2px; }
.menu button { display: flex; align-items: center; gap: var(--space-3); width: 100%; text-align: left; padding: var(--space-3) var(--space-2); background: none; border: 0; border-radius: var(--radius-md); font-size: var(--text-base); min-height: 48px; }
.menu button:hover { background: var(--surface-offset); }
.menu button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.menu button.danger { color: var(--again); }
.menu button.danger svg { color: var(--again); }
.swatches { display: flex; gap: var(--space-2); flex-wrap: wrap; }
.swatches button { width: 36px; height: 36px; border-radius: 999px; border: 3px solid transparent; background: var(--c); }
.swatches button[aria-pressed='true'] { border-color: var(--text); }
.seg { display: inline-flex; background: var(--surface-offset); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: none; padding: var(--space-2) var(--space-4); border-radius: 999px; font-size: var(--text-sm); font-weight: 500; color: var(--muted); }
.seg button[aria-pressed='true'] { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }

/* ---------- Stats ---------- */
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
.kpi { padding: var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.kpi small { font-size: var(--text-xs); color: var(--muted); font-weight: 500; }
.kpi b { display: block; font-family: var(--font-display); font-size: var(--text-xl); line-height: 1.2; font-variant-numeric: tabular-nums; }
.panel { padding: var(--space-5); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-top: var(--space-3); }
.panel h3 { margin: 0 0 var(--space-4); font-size: var(--text-sm); font-weight: 600; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: var(--space-2); align-items: end; height: 140px; }
.bars .bar { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: var(--space-1); }
.bars .bar i { width: 100%; max-width: 32px; background: var(--primary); border-radius: 6px 6px 2px 2px; min-height: 3px; transition: height .5s var(--ease); }
.bars .bar.zero i { background: var(--surface-offset); }
.bars .bar em { font-style: normal; font-size: var(--text-xs); font-weight: 600; font-variant-numeric: tabular-nums; }
.bars .bar span { font-size: var(--text-xs); color: var(--muted); }
.heat { display: grid; grid-template-rows: repeat(7, 1fr); grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; }
.heat i { aspect-ratio: 1; border-radius: 3px; background: var(--surface-offset); }
.heat i.h1 { background: color-mix(in srgb, var(--primary) 28%, var(--surface-offset)); }
.heat i.h2 { background: color-mix(in srgb, var(--primary) 52%, var(--surface-offset)); }
.heat i.h3 { background: color-mix(in srgb, var(--primary) 76%, var(--surface-offset)); }
.heat i.h4 { background: var(--primary); }
.heat i.future { visibility: hidden; }
.stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--surface-offset); margin-bottom: var(--space-3); }
.stack i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-2) var(--space-4); font-size: var(--text-xs); color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); margin-right: 6px; vertical-align: -1px; }

/* ---------- Settings ---------- */
.set-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); margin-bottom: var(--space-4); overflow: hidden; }
.set-row { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); min-height: 56px; border-bottom: 1px solid var(--divider); }
.set-row:last-child { border-bottom: 0; }
.set-row .t { flex: 1; min-width: 0; }
.set-row .t b { display: block; font-weight: 500; font-size: var(--text-sm); }
.set-row .t small { color: var(--muted); font-size: var(--text-xs); }
.set-row input[type=number] { width: 76px; text-align: center; padding: var(--space-2); border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface-2); }
.set-row input[type=text] { width: 110px; text-align: center; padding: var(--space-2); border-radius: var(--radius-sm); border: 1.5px solid var(--border); background: var(--surface-2); }
.set-row button.as-row { all: unset; }
button.set-row { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--divider); text-align: left; }
button.set-row:hover { background: var(--surface-offset); }
.set-row .chev { color: var(--faint); }
.note { font-size: var(--text-xs); color: var(--muted); padding: 0 var(--space-2); margin: calc(var(--space-2) * -1) 0 var(--space-4); }
.warn-banner { font-size: var(--text-xs); background: var(--hard-soft); color: var(--hard); padding: var(--space-3) var(--space-4); border-radius: var(--radius-md); margin-bottom: var(--space-4); }

/* ---------- Toast ---------- */
#toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + var(--safe-b) + var(--space-6)); transform: translate(-50%, 20px); background: var(--text); color: var(--inverse); padding: var(--space-3) var(--space-5); border-radius: 999px; font-size: var(--text-sm); font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .3s var(--ease); z-index: 60; max-width: calc(100% - 2rem); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }

.view-enter { animation: enter .35s var(--ease); }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.pop { animation: pop .3s var(--ease); }
@keyframes pop { from { opacity: 0; transform: scale(.97) translateY(8px); } to { opacity: 1; transform: none; } }

.katex { font-size: 1.08em; }
.face .katex-display, .q-card .katex-display { margin: .4em 0; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

[data-theme='dark'] .deck .spine { filter: brightness(1.7) saturate(.85); }
.btn { white-space: nowrap; }

/* ---------- Import ---------- */
.imp-tabs { display: flex; width: 100%; margin-bottom: var(--space-4); }
.imp-tabs button { flex: 1; }
.imp-tabs button.on { background: var(--surface-2); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.dropzone { display: grid; justify-items: center; gap: var(--space-1); text-align: center; padding: var(--space-6) var(--space-4); border: 1.5px dashed var(--border); border-radius: var(--radius-lg); background: var(--surface); cursor: pointer; margin-bottom: var(--space-3); transition: border-color .2s, background .2s; }
.dropzone:hover, .dropzone:focus-visible, .dropzone.over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, var(--surface)); outline: none; }
.dropzone svg { width: 28px; height: 28px; stroke: var(--primary); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-bottom: var(--space-1); }
.dropzone b { font-size: var(--text-sm); color: var(--primary); }
.dropzone span { font-size: var(--text-xs); color: var(--muted); }
.file-list { list-style: none; margin: 0 0 var(--space-4); padding: 0; display: grid; gap: var(--space-2); }
.file-list:empty { display: none; }
.file-list li { display: flex; align-items: center; gap: var(--space-2); padding: var(--space-2) var(--space-2) var(--space-2) var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); }
.file-list li > div { flex: 1; min-width: 0; display: grid; }
.file-list li b { font-size: var(--text-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-list li span { font-size: var(--text-xs); color: var(--muted); }
.file-list li.bad span { color: var(--again); }
.file-list .icon-btn { width: 36px; height: 36px; }
.opt-rows { display: grid; gap: var(--space-2); margin-bottom: var(--space-4); }
.check { display: flex; align-items: center; gap: var(--space-3); font-size: var(--text-sm); min-height: 32px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.imp-prev { background: var(--surface-offset); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-4); font-size: var(--text-sm); }
.imp-sum { margin-bottom: var(--space-2); }
.imp-sum span { color: var(--muted); }
.imp-prev table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.imp-prev th { text-align: left; font-size: var(--text-xs); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: var(--space-1) var(--space-2) var(--space-1) 0; }
.imp-prev td { padding: var(--space-2) var(--space-2) var(--space-2) 0; border-top: 1px solid var(--border); vertical-align: top; overflow-wrap: anywhere; white-space: pre-wrap; }
.imp-prev .more { font-size: var(--text-xs); color: var(--muted); padding-top: var(--space-2); }
.btn:disabled { opacity: .45; pointer-events: none; }
[hidden] { display: none !important; }

/* ---------- Écran de verrouillage ---------- */
.gate { min-height: calc(100dvh - var(--space-12)); display: flex; flex-direction: column; justify-content: center; max-width: 380px; margin: 0 auto; padding: var(--space-8) 0; }
.gate-logo svg { width: 56px; height: 56px; color: var(--primary); margin-bottom: var(--space-5); }
.gate h1 { font-family: var(--font-display); font-size: var(--text-xl); margin: 0 0 var(--space-2); }
.gate > p { color: var(--muted); font-size: var(--text-sm); margin: 0 0 var(--space-6); }
.gate .gate-note { margin: var(--space-5) 0 0; font-size: var(--text-xs); color: var(--faint); }
.gate-switch { text-align: center; margin-top: var(--space-4); font-size: var(--text-sm); color: var(--muted); }
.gate-switch a { color: var(--primary); font-weight: 600; text-decoration: none; }
.gate-switch a:hover { text-decoration: underline; }
.gate-err { min-height: 1.2em; color: var(--again); font-size: var(--text-sm); margin: calc(var(--space-2) * -1) 0 var(--space-3); }
.pw { position: relative; }
.pw input { padding-right: 52px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; color: var(--muted); border-radius: 999px; }
.pw-eye svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ================================================================ HABITS
   Composants du tracker d'habitudes, adaptés au design system d'Ancre.
   ================================================================ */

/* ---------- Dashboard: today's habits ---------- */
.today-habits { background: var(--surface-2); border-radius: var(--radius-xl); box-shadow: var(--shadow-card); padding: var(--space-5); margin-bottom: var(--space-4); }
.today-habits .section-head { margin: 0 0 var(--space-3); }
.today-habits .section-head h2 { font-size: var(--text-sm); }
.habit-check { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border-bottom: 1px solid var(--divider); }
.habit-check:last-child { border-bottom: 0; }
.habit-check .chk { width: 28px; height: 28px; border-radius: 9px; border: 1.5px solid var(--border); background: transparent; display: grid; place-items: center; flex: none; transition: transform .15s; position: relative; cursor: pointer; }
.habit-check .chk { border-color: var(--cat-col, var(--border)); }
.habit-check .chk.on { background: var(--cat-col, var(--good)); border-color: transparent; box-shadow: 0 0 0 4px color-mix(in srgb, var(--cat-col, var(--good)) 18%, transparent); }
.habit-check .chk:active { transform: scale(.85); }
.habit-check .chk svg { width: 14px; height: 14px; stroke: var(--inverse); stroke-width: 3; fill: none; display: none; }
.habit-check .chk.on svg { display: block; }
.habit-check .chk.burst::after { content: ''; position: absolute; inset: -6px; border-radius: 12px; border: 2px solid var(--cat-col, var(--good)); animation: burstRing .5s ease-out forwards; }
@keyframes burstRing { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(1.7); } }
.habit-check .h-name { flex: 1; font-weight: 500; font-size: var(--text-sm); }
.habit-check .h-name.on { text-decoration: line-through; color: var(--muted); }
.habit-check .h-streak { font-size: var(--text-xs); font-weight: 600; color: var(--hard); font-variant-numeric: tabular-nums; }
.habit-check .cat-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

/* ---------- Catégories ---------- */
.cat-chip { display: inline-flex; align-items: center; gap: 5px; padding: var(--space-2) var(--space-3); border-radius: 999px; font-size: var(--text-xs); font-weight: 600; background: var(--surface-offset); color: var(--muted); border: 1px solid var(--border); cursor: pointer; transition: transform .12s; }
.cat-chip:active { transform: scale(.95); }
.cat-chip.on { color: var(--cat-col); border-color: var(--cat-col); background: color-mix(in srgb, var(--cat-col) 10%, transparent); }
.cat-chip .cat-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cat-col); }
.cat-tag { font-size: 9.5px; font-weight: 700; padding: 2px var(--space-2); border-radius: 999px; margin-left: var(--space-2); background: color-mix(in srgb, var(--cat-col) 15%, transparent); color: var(--cat-col); white-space: nowrap; }

/* ---------- Day selector chips ---------- */
.day-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: var(--space-4); }
.day-chip { padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); font-size: var(--text-xs); font-weight: 600; background: var(--surface-offset); color: var(--muted); border: 1px solid var(--border); cursor: pointer; transition: transform .12s; }
.day-chip:active { transform: scale(.92); }
.day-chip.on { background: color-mix(in srgb, var(--primary) 15%, transparent); color: var(--primary); border-color: var(--primary); }

/* ---------- Preset chips ---------- */
.preset-wrap { display: flex; gap: var(--space-2); overflow-x: auto; padding-bottom: var(--space-2); margin-bottom: var(--space-4); }
.preset-chip { flex: none; padding: var(--space-2) var(--space-3); border-radius: 999px; font-size: var(--text-xs); font-weight: 600; background: var(--hard-soft); color: var(--hard); border: 1px solid color-mix(in srgb, var(--hard) 30%, transparent); white-space: nowrap; cursor: pointer; }
.preset-chip:active { transform: scale(.95); }

/* ---------- Habit cards ---------- */

  <script>
  // Filet de sécurité : si l'appli reste bloquée sur « Chargement… » (ancienne version restée en cache, script en erreur…),
  // on propose un bouton qui vide le cache de l'appli et recharge. Les données (compte, paquets) ne sont pas touchées.
  (function () {
    var MS = window.__WATCHDOG_MS || 12000;
    function txt() { var a = document.getElementById('app'); return a ? (a.textContent || '').replace(/\s+/g, ' ').trim() : null; }
    function loading() { var t = txt(); return t !== null && /^Chargement/.test(t); }
    function blank() { return txt() === ''; }
    function repair() {
      var jobs = [];
      try { if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
    }
    function show() {
      var a = document.getElementById('app'); if (!a) return;
      a.innerHTML = '<div style="padding:2rem 1.25rem;text-align:center;font-family:system-ui,sans-serif"><h2 style="margin:0 0 .5rem">Ancre ne démarre pas</h2><p style="margin:0 0 1.25rem;opacity:.75;line-height:1.45">Une ancienne version est peut-être restée en mémoire sur cet appareil. Tes données ne seront pas effacées.</p><button id="ancre-repair" style="padding:.75rem 1.25rem;border-radius:10px;border:0;background:#c6613f;color:#fff;font-size:1rem;cursor:pointer">Réparer et recharger</button></div>';
      document.getElementById('ancre-repair').onclick = repair;
    }
    setTimeout(function () { if (loading() || blank()) show(); }, MS);
    function onFail() { setTimeout(function () { if (loading()) show(); }, 1500); }
    window.addEventListener('error', onFail);
    window.addEventListener('unhandledrejection', onFail);
  })();

  <script>/* merge */
// merge.js — Fusion à 3 voies (base / local / distant) de l'état Ancre.
// base = dernier état synchronisé ; local et distant = deux versions modifiées indépendamment.
// Les tableaux d'objets sont fusionnés par identifiant, les objets clé par clé : les modifications
// faites sur deux appareils sont donc conservées, au lieu que la plus récente écrase tout.
(function () {
  'use strict';
  var isObj = function (x) { return x && typeof x === 'object' && !Array.isArray(x); };
  var eq = function (a, b) { return JSON.stringify(a) === JSON.stringify(b); };

  // Clé d'identité d'un élément de tableau (null = tableau non fusionnable élément par élément)
  function keyOf(path, item) {
    if (!isObj(item)) return null;
    if (path === 'log') return item.t + '|' + item.c;          // historique de réponses : append-only
    if (path === 'routines.steps') return null;
    return item.id != null ? String(item.id) : null;
  }

  function mergeArray(path, base, local, remote) {
    var all = [].concat(base || [], local || [], remote || []);
    if (!all.length) return [];
    if (!all.every(function (x) { return keyOf(path, x) !== null; })) {
      // pas d'identifiants : le côté modifié gagne ; si les deux ont changé, le local (action la plus récente de l'utilisateur)
      if (eq(local, base)) return remote;
      return local;
    }
    var idx = function (arr) { var m = new Map(); (arr || []).forEach(function (x) { m.set(keyOf(path, x), x); }); return m; };
    var B = idx(base), L = idx(local), R = idx(remote);
    var order = [], seen = new Set();
    // ordre : local d'abord (ordre de l'utilisateur), puis éléments ajoutés côté distant
    (local || []).concat(remote || []).forEach(function (x) { var k = keyOf(path, x); if (!seen.has(k)) { seen.add(k); order.push(k); } });
    var out = [];
    order.forEach(function (k) {
      var b = B.get(k), l = L.get(k), r = R.get(k);
      var inB = B.has(k), inL = L.has(k), inR = R.has(k);
      if (inL && inR) { out.push(mergeValue(path, b, l, r)); return; }
      if (inL && !inR) { if (inB && eq(l, b)) return; /* supprimé à distance, non modifié ici */ out.push(l); return; }
      if (!inL && inR) { if (inB && eq(r, b)) return; /* supprimé ici, non modifié à distance */ out.push(r); return; }
    });
    if (path === 'log') out.sort(function (a, b) { return a.t - b.t; });
    return out;
  }

  function mergeValue(path, base, local, remote) {
    if (eq(local, remote)) return local;
    if (eq(local, base)) return remote;      // seul le distant a changé
    if (eq(remote, base)) return local;      // seul le local a changé
    if (Array.isArray(local) && Array.isArray(remote)) return mergeArray(path, Array.isArray(base) ? base : [], local, remote);
    if (isObj(local) && isObj(remote)) return mergeObject(path, isObj(base) ? base : {}, local, remote);
    return local; // conflit sur une valeur simple : le local (action la plus récente ici) gagne
  }

  function mergeObject(path, base, local, remote) {
    var out = {};
    var keys = new Set([].concat(Object.keys(base), Object.keys(local), Object.keys(remote)));
    keys.forEach(function (k) {
      var inB = k in base, inL = k in local, inR = k in remote;
      var sub = path ? path + '.' + k : k;
      // les cartes des tableaux imbriqués (ex. routines[].steps) gardent un chemin générique
      if (inL && inR) { out[k] = mergeValue(childPath(path, k, local[k]), base[k], local[k], remote[k]); return; }
      if (inL) { if (inB && eq(local[k], base[k])) return; out[k] = local[k]; return; }   // supprimé à distance
      if (inR) { if (inB && eq(remote[k], base[k])) return; out[k] = remote[k]; return; } // supprimé en local
    });
    return out;
  }
  function childPath(path, k, v) {
    // chemins « de collection » utilisés par keyOf : decks, cards, log, habits, routines
    if (!path && Array.isArray(v)) return k;
    if (path === 'routines' ) return 'routines.' + k;
    return path ? path + '.' + k : k;
  }

  window.AncreMerge = {
    // base peut être null (première synchro) : on retombe alors sur une union prudente.
    merge: function (base, local, remote) {
      var out = mergeObject('', base && isObj(base) ? base : {}, local, remote);
      // les routines ont des étapes sans identifiant stable : on traite chaque routine comme un tout
      return out;
    },
    equal: eq
  };
})();

// Les bibliothèques lourdes (pdf.js, Tesseract, SheetJS) sont chargées à la demande.

const DAYS_FR = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];
const DAYS_MAP = {};
DAYS_FR.forEach((d, i) => { DAYS_MAP[d] = i; DAYS_MAP[d.slice(0, 3)] = i; });

const DAY_RX = /\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche|lun\.?|mar\.?|mer\.?|jeu\.?|ven\.?|sam\.?|dim\.?)(?=\s|$|[^a-zà-ÿ])/i;
// 8h30-10h30 · 8h-10h · 8:30 – 10:30 · 8h à 10h
const TIME_H = /(\d{1,2})\s*[hH:]\s*(\d{2})?\s*(?:[-–—]|à)\s*(\d{1,2})\s*[hH:]\s*(\d{2})?/;
// 8-10 (sans « h »)
const TIME_PLAIN = /(?<![\d:])(\d{1,2})\s*[-–—]\s*(\d{1,2})(?![\d:])/;

function matchTime(text) {
  let m = text.match(TIME_H);
  if (m) {
    const sh = +m[1], sm = m[2] ? +m[2] : 0, eh = +m[3], em = m[4] ? +m[4] : 0;
    if (sh > 23 || eh > 24 || sm > 59 || em > 59) return null;
    const f = (h, mi) => (mi ? `${h}h${String(mi).padStart(2, '0')}` : `${h}h`);
    return { index: m.index, length: m[0].length, start: sh + sm / 60, end: eh + em / 60, label: `${f(sh, sm)}-${f(eh, em)}` };
  }
  m = text.match(TIME_PLAIN);
  if (m) {
    const sh = +m[1], eh = +m[2];
    if (sh > 23 || eh > 24 || eh <= sh) return null;
    return { index: m.index, length: m[0].length, start: sh, end: eh, label: `${sh}h-${eh}h` };
  }
  return null;
}

const ROOM_RX = /(salle\s+\S+|amphi\s+\S+|bât\.?\s*\S+|bat\.?\s*\S+|s\.\s*\d+)/i;
const stripSep = (s) => s.replace(/\s+/g, ' ').replace(/^[\s|–—-]+|[\s|–—-]+$/g, '');

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    el.src = src; el.onload = resolve; el.onerror = () => reject(new Error('Impossible de charger ' + src));
    document.head.appendChild(el);
  });
}
const LIBS = {
  async pdf() {
    if (!window.pdfjsLib) await loadScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    return window.pdfjsLib;
  },
  async ocr() { if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'); return window.Tesseract; },
  async xlsx() { if (!window.XLSX) await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); return window.XLSX; },
};

const hasExt = (name, exts) => exts.some((e) => name.endsWith(e));

window.DocParser = {
  async extractText(file) {
    const name = file.name.toLowerCase();
    if (hasExt(name, ['.pdf'])) return this.extractFromPDF(file);
    if (hasExt(name, ['.png', '.jpg', '.jpeg', '.bmp', '.tiff', '.webp'])) return this.extractFromImage(file);
    if (hasExt(name, ['.xlsx', '.xls'])) return this.extractFromExcel(file);
    return file.text(); // csv, tsv, txt, inconnu
  },

  async extractFromPDF(file) {
    const pdfjs = await LIBS.pdf();
    const pdf = await pdfjs.getDocument({ data: await file.arrayBuffer() }).promise;
    let text = '';
    for (let p = 1; p <= pdf.numPages; p++) {
      const content = await (await pdf.getPage(p)).getTextContent();
      // Reconstruit les lignes visuelles : même ordonnée (y) → même ligne, triées par x.
      const rows = new Map();
      for (const it of content.items) {
        if (!it.str || !it.str.trim()) continue;
        const y = Math.round(it.transform[5] / 3);
        if (!rows.has(y)) rows.set(y, []);
        rows.get(y).push({ x: it.transform[4], s: it.str });
      }
      [...rows.entries()].sort((a, b) => b[0] - a[0]).forEach(([, cells]) => {
        text += cells.sort((a, b) => a.x - b.x).map((c) => c.s).join(' ') + '\n';
      });
    }
    return text;
  },

  async extractFromImage(file) {
    const T = await LIBS.ocr();
    const { data } = await T.recognize(file, 'fra');
    return data.text;
  },

  async extractFromExcel(file) {
    const X = await LIBS.xlsx();
    const wb = X.read(await file.arrayBuffer());
    return wb.SheetNames.map((n) => X.utils.sheet_to_csv(wb.Sheets[n], { FS: '\t' })).join('\n');
  },

  parseSchedule(text) {
    const lines = text.split('\n');
    const schedule = {};
    let currentDay = null;

    for (let raw of lines) {
      const line = raw.trim();
      if (!line) continue;

      const dm = line.match(DAY_RX);
      if (dm) {
        const key = dm[1].toLowerCase().replace(/\./g, '');
        if (key in DAYS_MAP) {
          currentDay = DAYS_MAP[key];
          if (!schedule[currentDay]) schedule[currentDay] = [];
          const ev = this.parseEvent(line.slice(0, dm.index) + ' ' + line.slice(dm.index + dm[0].length));
          if (ev) schedule[currentDay].push(ev);
          continue;
        }
      }
      if (currentDay === null) continue;
      if (matchTime(line)) {
        const ev = this.parseEvent(line);
        if (ev) schedule[currentDay].push(ev);
      } else if (schedule[currentDay].length) {
        const last = schedule[currentDay][schedule[currentDay].length - 1];
        if (!last.room && /\b(salle|s\.|amphi|bât|bat|couloir)\b/i.test(line)) last.room = line;
        else if (!last.teacher && line.length < 60) last.teacher = line;
      }
    }

    // Repli : jour + horaire sur la même ligne
    if (!Object.keys(schedule).length) {
      for (const line of lines) {
        const dm = line.match(DAY_RX);
        if (!dm) continue;
        const key = dm[1].toLowerCase().replace(/\./g, '');
        if (!(key in DAYS_MAP)) continue;
        const ev = this.parseEvent(line);
        if (ev) (schedule[DAYS_MAP[key]] ||= []).push(ev);
      }
    }

    return Object.keys(schedule).map(Number).sort((a, b) => a - b)
      .filter((d) => schedule[d].length)
      .map((d) => ({ day: DAYS_FR[d], dayIdx: d, events: schedule[d].sort((a, b) => a.startHour - b.startHour) }));
  },

  parseEvent(text) {
    text = (text || '').trim();
    const t = matchTime(text);
    if (!t) return null;
    let subject = text.slice(0, t.index) + ' ' + text.slice(t.index + t.length);
    subject = subject.replace(DAY_RX, ' ');
    let room = null;
    const rm = subject.match(ROOM_RX);
    if (rm) { room = rm[0]; subject = subject.replace(rm[0], ' '); }
    subject = stripSep(subject) || 'Cours';
    return { time: t.label, startHour: t.start, endHour: t.end, subject, room, teacher: null };
  },

  generateRoutines(schedule, routineName = 'Emploi du temps') {
    return schedule.filter((d) => d.events.length).map((d) => ({
      id: `routine_${d.dayIdx}`,
      name: `${d.day} — ${routineName}`,
      steps: d.events.map((ev, i) => ({
        id: `st${i}`,
        text: `${ev.time} — ${ev.subject}${ev.room ? ` (${ev.room})` : ''}${ev.teacher ? ` — ${ev.teacher}` : ''}`,
      })),
    }));
  },

  async parseDocument(file) {
    try {
      const text = await this.extractText(file);
      if (!text.trim()) return { success: false, error: 'Aucun texte extrait du document.', textPreview: '', schedule: [], routines: [] };
      const schedule = this.parseSchedule(text);
      const routines = this.generateRoutines(schedule);
      return {
        success: true, textPreview: text.slice(0, 2000), schedule, routines,
        routineCount: routines.length,
        eventCount: schedule.reduce((n, d) => n + d.events.length, 0),
      };
    } catch (e) {
      return { success: false, error: `Erreur : ${e.message}`, textPreview: '', schedule: [], routines: [] };
    }
  },
};

  // Local (localStorage, par utilisateur) + cloud (Supabase). Le plus récent gagne (db.updatedAt).
  let storageOK = true;
  let token = null;
  let lastSent = '';        // dernier état confirmé côté cloud (JSON)
  let cloudReady = false;   // true seulement si on a pu LIRE le cloud : évite d'écraser des données jamais vues
  let freshSeed = false;    // true si cet appareil n'avait aucune copie locale (le cloud doit alors gagner)
  let pendingSave = false;
  let syncWarned = false;

  // ------------------------------------------------------------ écran de connexion / inscription
  let currentUsername = null;
  function gate(mode, opts = {}) {
    // mode : 'login' · 'register' · 'forgot' (mot de passe oublié) · 'recovery' (nouveau mot de passe après le lien reçu par e-mail)

      document.body.classList.add('focus');
      const A = window.AuthClient;
      const M = {
        login:    A.claudeOnly ? { h: 'Connexion', p: 'Ancre utilise ton compte Claude : ouvre-la depuis l\'appli Claude (connecté) pour retrouver tes données.', btn: 'Réessayer' } : { h: 'Connexion', p: 'Connecte-toi pour retrouver tes paquets, habitudes et progression sur tous tes appareils.', btn: 'Se connecter' },
        register: { h: 'Créer un compte', p: 'Avec ton adresse e-mail, tes données sont sauvegardées sur ton compte et disponibles partout.', btn: 'Créer le compte' },

      }[mode];
      const co = !!A.claudeOnly && mode === 'login';
      const needEmail = mode !== 'recovery' && !co;
      const needPw = mode !== 'forgot' && !co;
      const needPw2 = mode === 'register' || mode === 'recovery';
      app.innerHTML = `<section class="gate">
        <div class="gate-logo">${LOGO}</div>
        <h1>${M.h}</h1>
        <p>${M.p}</p>
        ${opts.notice ? `<p class="gate-ok" id="gnote" role="status">${esc(opts.notice)}</p>` : ''}
        <form id="gf" autocomplete="on" novalidate>
          ${needEmail ? `<div class="field"><label for="gu">${mode === 'login' ? 'E-mail' : 'Adresse e-mail'}</label>
            <input id="gu" type="${mode === 'login' ? 'text' : 'email'}" inputmode="email" maxlength="254" required autocomplete="${mode === 'register' ? 'email' : 'username'}" autocapitalize="off" spellcheck="false" placeholder="${mode === 'login' ? 'toi@exemple.fr' : 'toi@exemple.fr'}" value="${esc(opts.email || '')}"></div>` : ''}
          ${needPw ? `<div class="field"><label for="gp">${mode === 'recovery' ? 'Nouveau mot de passe' : 'Mot de passe'}</label>
            <div class="pw"><input id="gp" type="password" maxlength="128" required autocomplete="${mode === 'login' ? 'current-password' : 'new-password'}" placeholder="6 caractères minimum"><button type="button" class="pw-eye" aria-label="Afficher le mot de passe">${ICON.eye || 'voir'}</button></div></div>` : ''}
          ${needPw2 ? `<div class="field"><label for="gp2">Confirme le mot de passe</label><input id="gp2" type="password" maxlength="128" required autocomplete="new-password"></div>` : ''}
          <p class="gate-err" id="gerr" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block" id="gok">${M.btn}</button>
        </form>
        ${mode === 'login' && !co ? '<p class="gate-switch"><a href="#" id="gforgot">Mot de passe oublié ?</a></p>' : ''}
        ${mode !== 'recovery' && !co ? `<p class="gate-switch" id="gswitch">${mode === 'register' ? 'Déjà un compte ? <a href="#">Se connecter</a>' : mode === 'forgot' ? '<a href="#">Retour à la connexion</a>' : 'Pas encore de compte ? <a href="#">S\'inscrire</a>'}</p>` : ''}
        ${mode === 'login' && !co ? '<p class="gate-note">Ancien compte avec un nom d\'utilisateur ? Entre-le à la place de l\'e-mail, puis ajoute une adresse dans Réglages › Compte.</p>' : ''}
      </section>`;
      const u = $('#gu'), p = $('#gp'), err = $('#gerr'), ok = $('#gok');
      const eye = $('.pw-eye'); if (eye) eye.onclick = () => { const t = p.type === 'password' ? 'text' : 'password'; p.type = t; if ($('#gp2')) $('#gp2').type = t; };
      const sw = $('#gswitch'); if (sw) sw.onclick = (e) => { e.preventDefault(); gate(mode === 'register' || mode === 'forgot' ? 'login' : 'register', { email: u ? u.value : '' }).then(resolve); };
      const fg = $('#gforgot'); if (fg) fg.onclick = (e) => { e.preventDefault(); gate('forgot', { email: u.value }).then(resolve); };
      setTimeout(() => (u || p || $('#gok')).focus(), 50);
      $('#gf').onsubmit = async (e) => { e.preventDefault(); await submitGate(); };
      async function submitGate() {
        err.textContent = '';
        const id = u ? u.value.trim() : '';
        const password = p ? p.value : '';
        if (needPw2 && (password.length < 6)) { err.textContent = 'Le mot de passe doit faire au moins 6 caractères.'; return; }
        if (needPw2 && password !== $('#gp2').value) { err.textContent = 'Les deux mots de passe ne correspondent pas.'; return; }
        ok.disabled = true; const label = ok.textContent; ok.textContent = 'Un instant…';
        try {
          if (mode === 'forgot') {
            const r = await A.resetPassword(id);
            if (r.ok) { gate('login', { email: id, notice: 'Si un compte existe pour cette adresse, un e-mail de réinitialisation vient d\'être envoyé. Pense à regarder tes spams.' }).then(resolve); return; }
            err.textContent = r.error;
          } else if (mode === 'recovery') {
            const r = await A.changePassword(password);
            if (r.ok) { currentUsername = A.currentUser(); document.body.classList.remove('focus'); resolve(); return; }
            err.textContent = r.error || 'Erreur, réessaie.';
          } else {
            const r = mode === 'register' ? await A.register(id, password) : await A.login(id, password);
            if (r.ok && r.needsConfirm) { gate('login', { email: id, notice: 'Compte créé. Clique sur le lien de confirmation envoyé à ' + id + ', puis connecte-toi.' }).then(resolve); return; }
            if (r.ok) { token = 'local'; currentUsername = r.username || id; document.body.classList.remove('focus'); resolve(); return; }
            err.textContent = r.error || 'Erreur, réessaie.';
          }
        } catch (e) { err.textContent = 'Erreur : ' + (e.message || String(e)); }

    });
  }
  async function ensureAuth() {
    const A = window.AuthClient;
    let notice = '';
    if (A) {
      const via = await A.consumeUrl();          // lien reçu par e-mail (confirmation, réinitialisation…)
      await A.restoreSession();
      if (A.onSignedOut) A.onSignedOut(() => { if (!locking) lockApp(true); });
      if (via && via.error) notice = via.error;
      if (A.isLoggedIn()) {
        currentUsername = A.currentUser();
        if (via && via.type === 'recovery') await gate('recovery');
        else if (via && via.type === 'email_change') setTimeout(() => toast('Adresse e-mail mise à jour'), 800);
        else if (via) setTimeout(() => toast('Adresse e-mail confirmée'), 800);
        return true;
      }
    }
    await gate('login', notice ? { notice } : {});
    return true;
  }
  let locking = false;
  async function lockApp(expired = false) {
    if (locking) return; locking = true;
    try {
      if (db) { saveNow(true); if (!expired) await pushCloud(); }
      clearTimeout(saveTimer); clearTimeout(cloudSaveTimer);
      if (!expired && window.AuthClient) await window.AuthClient.logout();
      db = null; cloudReady = false; lastSent = ''; pendingSave = false;
      token = null; currentUsername = null; closeSheet();
      await gate('login');
      await load(); applyTheme();
      try { history.replaceState(null, '', '#/'); } catch { location.hash = '#/'; }
      route();
    } catch (e) { fatal(e); }
    finally { locking = false; }
  }

  const DEFAULT_SETTINGS = { newPerDay: 20, maxPerDay: 0, steps: [1, 10], relearn: [10], gradIvl: 1, easyIvl: 4, maxIvl: 3650, theme: 'auto' };
  let db;
  function seed() {
    const now = Date.now();
    const d = { decks: [], cards: [], log: [], settings: { ...DEFAULT_SETTINGS }, habits: [], comp: {}, routines: [], rcomp: {}, notes: {}, v: 2 };
    (window.SEED_DECKS || []).forEach((sd, i) => {
      const deck = { id: uid(), name: sd.name, color: DECK_COLORS[i % DECK_COLORS.length], created: now + i };
      d.decks.push(deck);
      sd.cards.forEach(([front, back], j) => d.cards.push(newCard(deck.id, front, back, now + i * 1000 + j)));
    });
    (window.SEED_HABITS || []).forEach((sh, i) => {
      d.habits.push({ id: 'h' + (now + i), name: sh.name, days: sh.days || [0,1,2,3,4,5,6], cat: sh.cat || 'perso' });
    });
    return d;
  }
  function newCard(deckId, front, back, created = Date.now()) {
    return { id: uid(), deckId, front, back, created, state: 'new', due: 0, ivl: 0, ease: 2.5, reps: 0, lapses: 0, step: 0 };
  }
  // Assainit un état venant du serveur ou d'une sauvegarde : identifiants et couleurs stricts.
  function sanitizeState(d) {
    const okId = (x) => typeof x === 'string' && /^[a-z0-9_-]{1,40}$/i.test(x);
    const okColor = (x) => typeof x === 'string' && /^#[0-9a-f]{3,8}$/i.test(x);
    const ids = new Set();
    d.decks = d.decks.filter((x) => x && typeof x === 'object').map((x, i) => {
      const id = okId(x.id) ? x.id : uid(); ids.add(id);
      return { ...x, id, name: String(x.name ?? 'Paquet').slice(0, 120), color: okColor(x.color) ? x.color : DECK_COLORS[i % DECK_COLORS.length] };
    });
    d.cards = d.cards.filter((c) => c && typeof c === 'object' && ids.has(c.deckId)).map((c) => ({ ...c, id: okId(c.id) ? c.id : uid(), front: String(c.front ?? ''), back: String(c.back ?? '') }));
    d.log = Array.isArray(d.log) ? d.log.filter((e) => e && typeof e === 'object') : [];
    d.settings = { ...DEFAULT_SETTINGS, ...(d.settings && typeof d.settings === 'object' ? d.settings : {}) };
    // Habitudes
    d.habits = Array.isArray(d.habits) ? d.habits.filter((h) => h && typeof h === 'object').map((h, i) => ({
      id: okId(h.id) ? h.id : 'h' + Date.now() + i,
      name: String(h.name ?? 'Habitude').slice(0, 120),
      days: Array.isArray(h.days) ? h.days.filter((d) => d >= 0 && d <= 6) : [0,1,2,3,4,5,6],
      cat: HABIT_CATS[h.cat] ? h.cat : 'perso',
    })) : [];
    d.comp = (d.comp && typeof d.comp === 'object') ? d.comp : {};
    d.routines = Array.isArray(d.routines) ? d.routines.filter((r) => r && typeof r === 'object').map((r, i) => ({
      id: okId(r.id) ? r.id : 'r' + Date.now() + i,
      name: String(r.name ?? 'Routine').slice(0, 120),
      steps: Array.isArray(r.steps) ? r.steps.filter((s) => s && typeof s === 'object').map((s, j) => ({ id: 'st' + j, text: String(s.text ?? '').slice(0, 500) })) : [],
    })) : [];
    d.rcomp = (d.rcomp && typeof d.rcomp === 'object') ? d.rcomp : {};
    d.notes = (d.notes && typeof d.notes === 'object') ? d.notes : {};
    return d;
  }
  // Clés locales par compte (id Supabase) : chaque compte garde ses données séparées sur l'appareil.
  const acctId = () => (window.AuthClient && window.AuthClient.currentUserId()) || currentUsername || 'default';
  const localKey = () => 'ancre_state_' + acctId();
  const baseKey = () => 'ancre_base_' + acctId();   // dernier état connu comme synchronisé (base de la fusion)
  const stable = (d) => JSON.stringify(d, (k, v) => {
    if (k === 'updatedAt') return undefined;
    if (v && typeof v === 'object' && !Array.isArray(v)) return Object.keys(v).sort().reduce((o, x) => { o[x] = v[x]; return o; }, {});
    return v;
  });
  function readJSON(key) {
    try { const raw = localStorage.getItem(key); if (raw) { const d = JSON.parse(raw); if (d && Array.isArray(d.decks) && Array.isArray(d.cards)) return d; } } catch {}
    return null;
  }
  function readLocal() {
    let d = readJSON(localKey());
    if (!d && currentUsername) { // migration : ancienne clé basée sur le nom d'utilisateur
      d = readJSON('ancre_state_' + currentUsername);
      if (d) { try { localStorage.setItem(localKey(), JSON.stringify(d)); } catch {} }
    }
    return d ? sanitizeState(d) : null;
  }
  function writeLocal() { try { localStorage.setItem(localKey(), JSON.stringify(db)); } catch { /* stockage bloqué : mémoire seule */ } }
  function writeBase() {}
  let cloudRev = null;     // version (rev) de la ligne cloud qu'on a lue en dernier
  let lastSyncAt = 0;      // horodatage de la dernière synchro réussie
  let syncing = null;      // promesse en cours (évite les synchros concurrentes)

  async function load() {
    const local = readLocal();
    freshSeed = !local;
    db = local || seed();
    lastSent = ''; cloudReady = false; cloudRev = null;
    const A = window.AuthClient;
    await reconcile();
    // Nouvel appareil + cloud illisible : surtout ne pas continuer avec les paquets de départ (ils écraseraient le cloud).
    if (freshSeed && A && A.isLoggedIn() && !cloudReady) throw new Error('SYNC_FAILED');
    freshSeed = false;
  }

  // Synchronise local ↔ cloud avec fusion à 3 voies. Renvoie 'pulled' si des changements distants ont été intégrés,
  // true si tout est à jour, false si le cloud est injoignable.
  function reconcile() {
    if (syncing) return syncing;
    syncing = (async () => {
      try { return await reconcileOnce(); } finally { syncing = null; }
    })();
    return syncing;
  }
  async function reconcileOnce() {
    const A = window.AuthClient;
    if (!A || !A.isLoggedIn() || !db) return false;
    let pulled = false;
    for (let attempt = 0; attempt < 4; attempt++) {
      const r = await A.loadData();
      if (!r.ok) { cloudReady = false; return false; }          // erreur (≠ « vide ») : on ne pousse RIEN
      cloudReady = true; cloudRev = r.rev;
      const remote = r.data && Array.isArray(r.data.decks) && Array.isArray(r.data.cards) ? sanitizeState(r.data) : null;
      let target;
      if (!remote) { target = db; }                              // compte vide : on envoie l'état local
      else if (freshSeed) { target = remote; }                   // nouvel appareil : le cloud fait foi
      else {
        const base = readJSON(baseKey());
        target = sanitizeState(window.AncreMerge.merge(base ? sanitizeState(base) : null, db, remote));
        target.updatedAt = Math.max(Number(db.updatedAt) || 0, Number(remote.updatedAt) || 0);
      }
      const changedLocal = stable(target) !== stable(db);
      if (changedLocal) { db = target; pulled = true; writeLocal(); }
      freshSeed = false;
      if (remote && stable(target) === stable(remote)) { lastSent = stable(db); writeBase(db); lastSyncAt = Date.now(); break; }
      const w = await A.saveData(db, remote ? cloudRev : null);
      if (w.ok) { cloudRev = w.rev; lastSent = stable(db); writeBase(db); lastSyncAt = Date.now(); break; }
      if (!w.conflict) return false;                             // erreur réseau : retentera plus tard
      // conflit : un autre appareil a écrit entre notre lecture et notre écriture → on relit et on refusionne
    }
    return pulled ? 'pulled' : true;
  }

  let saveTimer, cloudSaveTimer;
  function save() { pendingSave = true; clearTimeout(saveTimer); saveTimer = setTimeout(() => saveNow(), 300); }
  // flush === true : simple vidage (onglet masqué/fermé), ne compte pas comme une modification.
  function saveNow(flush = false) {
    clearTimeout(saveTimer);
    if (!db) return;
    if (flush !== true) { db.updatedAt = Date.now(); pendingSave = false; }
    writeLocal();
    const A = window.AuthClient;
    if (!cloudReady || !A || !A.isLoggedIn()) return;
    clearTimeout(cloudSaveTimer);
    if (flush === true) {
      const snap = stable(db);
      if (snap !== lastSent && cloudRev !== null) A.saveBeacon(db, cloudRev); // si ça échoue, la fusion au prochain lancement rattrape
    } else {
      cloudSaveTimer = setTimeout(pushCloud, 1000);
    }
  }
  async function pushCloud() {
    clearTimeout(cloudSaveTimer);
    const A = window.AuthClient;
    if (!db || !cloudReady || !A || !A.isLoggedIn()) return;
    if (stable(db) === lastSent) return;
    const res = await reconcile();
    if (res === 'pulled' && !locking) { refreshView(); }
    if (res === false) { if (!syncWarned) { syncWarned = true; toast('Hors-ligne : tes modifications sont gardées et seront envoyées dès que possible'); } }
    else syncWarned = false;
  }
  // Re-rend la vue courante sans casser une séance d'étude ou une fenêtre ouverte.
  function refreshView() {
    const view = location.hash.replace(/^#\/?/, '').split('/')[0];
    if (['study', 'quiz', 'write'].includes(view) || $('.sheet') || $('#rp-root')) return;
    const ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return; // ne pas effacer une saisie en cours
    applyTheme(); route();
  }
  // Resynchronise quand on revient sur l'app / qu'on retrouve le réseau (autre appareil modifié entre-temps).
  async function syncNow(manual = false) {
    if (!db || locking || !window.AuthClient || !window.AuthClient.isLoggedIn()) return false;
    const view = location.hash.replace(/^#\/?/, '').split('/')[0];
    if (!manual && ['study', 'quiz', 'write'].includes(view)) return false; // pas de changement externe pendant une séance
    if (pendingSave) saveNow(); // écrit local ; la fusion ci-dessous envoie
    const res = await reconcile();
    if (res === 'pulled') { refreshView(); toast('Synchronisé depuis un autre appareil'); }
    else if (manual) toast(res ? 'Déjà à jour' : 'Synchronisation impossible (hors-ligne ?)');
    return res;
  }
  function fatal(err) {
    console.error('[Ancre]', err);
    document.body.classList.remove('focus');
    const msg = err && err.message === 'SYNC_FAILED'
      ? 'Impossible de joindre ton espace cloud. Vérifie ta connexion internet, puis réessaie.'
      : 'Une erreur est survenue au démarrage.';
    app.innerHTML = `<div class="done"><h2>Chargement impossible</h2><p>${esc(msg)}</p>
      <div class="btn-row"><button class="btn btn-primary" id="fx-retry">Réessayer</button><button class="btn btn-ghost" id="fx-out">Se déconnecter</button></div></div>`;
    $('#fx-retry').onclick = () => location.reload();
    $('#fx-out').onclick = async () => { try { if (window.AuthClient) await window.AuthClient.logout(); } catch {} location.reload(); };
  }


  const deckById = (id) => db.decks.find((d) => d.id === id);
  const descIds = (id) => { const out = [id]; for (let i = 0; i < out.length; i++) db.decks.forEach((d) => { if (d.parent === out[i] && !out.includes(d.id)) out.push(d.id); }); return out; };
  const deckPath = (d) => { const a = []; for (let x = d, n = 0; x && n < 12; x = deckById(x.parent), n++) a.unshift(x.name); return a.join('::'); };
  const cardsOf = (deckId) => { if (deckId === 'all') return db.cards; const s = new Set(descIds(deckId)); return db.cards.filter((c) => s.has(c.deckId)); };

  // ------------------------------------------------------------ scheduler
  // Algorithme SM-2 modifié (celui d'Anki) : étapes d'apprentissage en minutes,
  // puis intervalles en jours multipliés par un facteur de facilité (ease).
  function schedule(card, rating, now = Date.now()) {
    const s = db.settings;
    const c = { ...card };
    const steps = c.state === 'relearning' ? s.relearn : s.steps;
    const toReview = (ivl) => {
      c.state = 'review'; c.step = 0;
      c.ivl = Math.min(s.maxIvl, Math.max(1, Math.round(ivl)));
      c.due = dayStart(now) + c.ivl * DAY;
    };
    c.reps++;
    if (c.state === 'new' || c.state === 'learning' || c.state === 'relearning') {
      const wasRelearn = c.state === 'relearning';
      if (c.state === 'new') { c.state = 'learning'; c.step = 0; }
      if (rating === 1) { c.step = 0; c.due = now + steps[0] * MIN; }
      else if (rating === 2) {
        const d = c.step === 0 && steps.length > 1 ? (steps[0] + steps[1]) / 2 : steps[c.step] * 1.5;
        c.due = now + d * MIN;
      } else if (rating === 3) {
        c.step++;
        if (c.step >= steps.length) toReview(wasRelearn ? c.ivl : s.gradIvl);
        else c.due = now + steps[c.step] * MIN;
      } else {
        toReview(wasRelearn ? c.ivl + 1 : s.easyIvl);
      }
    } else { // review
      const ivl = c.ivl;
      if (rating === 1) {
        c.lapses++; c.ease = Math.max(1.3, c.ease - 0.2);
        c.ivl = 1; c.state = 'relearning'; c.step = 0; c.due = now + s.relearn[0] * MIN;
      } else {
        const hard = Math.max(ivl + 1, ivl * 1.2);
        const good = Math.max(hard + 1, ivl * c.ease);
        const easy = Math.max(good + 1, ivl * c.ease * 1.3);
        if (rating === 2) { c.ease = Math.max(1.3, c.ease - 0.15); toReview(hard); }
        else if (rating === 3) toReview(good);
        else { c.ease += 0.15; toReview(easy); }
      }
    }
    return c;
  }
  const previewLabel = (card, r) => { const now = Date.now(); return fmtIvl(schedule(card, r, now).due - now); };

  function newIntroducedToday(deckId) {
    const k = dayStart();
    const seen = new Set();
    for (let i = db.log.length - 1; i >= 0; i--) {
      const l = db.log[i]; if (l.t < k) break;
      if (l.s === 'new' && (deckId === 'all' || l.d === deckId)) seen.add(l.c);
    }
    return seen.size;
  }
  function seenToday() { const k = dayStart(), m = {}; for (let i = db.log.length - 1; i >= 0; i--) { const l = db.log[i]; if (l.t < k) break; (m[l.d] || (m[l.d] = new Set())).add(l.c); } return m; }
  const maxOf = (id) => { const m = deckById(id)?.maxPerDay ?? db.settings.maxPerDay; return m > 0 ? m : Infinity; };
  function newLimitLeft(deckId) {
    return (deckId === 'all' ? db.decks.map((d) => d.id) : descIds(deckId)).reduce((a, i) => a + ownLeft(i), 0);
  }
  function ownLeft(deckId) {
    const deck = deckById(deckId);
    const lim = deck?.newPerDay ?? db.settings.newPerDay;
    return Math.max(0, lim - newIntroducedToday(deckId));
  }
  function deckCounts(deckId) {
    const now = Date.now(), endDay = dayStart() + DAY, cs = cardsOf(deckId), seen = seenToday(), per = {};
    let l = 0, n = 0, r = 0;
    for (const c of cs) {
      const p = per[c.deckId] || (per[c.deckId] = { n: 0, r: 0 });
      if (c.state === 'new') p.n++;
      else if (c.state === 'learning' || c.state === 'relearning') { if (c.due < endDay) l++; }

  // ----------------------------------------------------------------- import

  async function zipRead(file, names) { // lit seulement la collection dans le zip : un .colpkg embarque tous les médias

  // -------------------------------------------------------------- study (SRS)
  function renderStudy(deckId) {

    let current = null, flipped = false, lastId = null;
    const initial = (() => { const c = deckCounts(deckId); return c.n + c.l + c.r; })();

    function frame() {
      const c = deckCounts(deckId);
      const kind = current ? (current.state === 'new' ? 'n' : current.state === 'review' ? 'r' : 'l') : '';
      const left = c.n + c.l + c.r;

          <button class="icon-btn" id="undo" aria-label="Annuler la dernière réponse" ${session.undo ? '' : 'disabled'}>${ICON.undo}</button>

        <div class="stage"><div class="flash pop" id="flash" role="button" tabindex="0" aria-label="Retourner la carte">
          <div class="face front"><span class="label">Question</span><div class="content">${esc(current.front)}</div><div class="hint-tap">Touche pour voir la réponse</div></div>
          <div class="face back"><span class="label">Réponse</span><div class="q">${esc(current.front)}</div><div class="content">${esc(current.back)}</div>
            <div class="swipe-tint left">Encore</div><div class="swipe-tint right">Bien</div></div>
        </div></div>

        <div class="kbd-hint desktop">Touches 1 · 2 · 3 · 4 (Espace = Bien)</div><div class="kbd-hint touch">Glisse à gauche : Encore · à droite : Bien</div>`;

    function answer(r) {
      const before = { ...current };

      if (idx < 0) { toast('Cette carte a été supprimée'); show(); return; }
      db.cards[idx] = after;
      const entry = { c: current.id, d: current.deckId, t: Date.now(), r, s: before.state, i: after.state === 'review' ? after.ivl : 0 };
      db.log.push(entry);

        if (Math.abs(dx) > 110) { answer(dx > 0 ? 3 : 1); return; }

      const upcoming = cardsOf(deckId).filter((c) => c.state !== 'new').sort((a, b) => a.due - b.due)[0];
      const nextTxt = upcoming ? (upcoming.state !== 'review' ? `Prochaine carte en apprentissage dans ${fmtIvl(Math.max(MIN, upcoming.due - Date.now()))}.` : `Prochaine révision dans ${fmtIvl(Math.max(HOUR, upcoming.due - Date.now()))}.`) : '';
      const acc = session.done ? Math.round(100 * (1 - session.again / session.done)) : 0;

        <div class="actions">
          ${deckId !== 'all' ? `<a class="btn btn-primary" href="#/quiz/${deckId}">S'entraîner en quiz</a>` : ''}

    }

      else if (flipped && ['1', '2', '3', '4'].includes(e.key)) answer(+e.key);
